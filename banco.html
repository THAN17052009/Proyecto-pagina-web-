<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Banco | TechBank Store</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="estilos.css">

</head>

<body>

<header class="top-header">

<div class="logo">

<h1>TECHBANK STORE</h1>

<p>Banco Digital</p>

</div>

<nav class="navbar">

<a href="index.html">Inicio</a>

<a href="productos.html">Productos</a>

<a href="banco.html">Banco</a>

<a href="carrito.html">Carrito</a>

<a href="login.html">Ingresar</a>

</nav>

</header>



<main class="container py-5">

<div class="row g-4">

<div class="col-lg-6">

<div class="card shadow-lg p-5">

<h2 class="mb-3">

Banco Digital

</h2>

<p>

Administra tu saldo, depósitos e intereses.

</p>

<hr>

<h5>

Saldo Disponible

</h5>

<h1
id="saldo"
class="text-primary">

$1000

</h1>

</div>

</div>



<div class="col-lg-6">

<div class="card shadow-lg p-5">

<h3 class="mb-4">

Depositar Dinero

</h3>

<input

class="form-control mb-3"

type="number"

id="montoDeposito"

placeholder="Ingrese monto"

>

<button

class="btn btn-primary w-100"

onclick="depositar()"

>

Depositar

</button>



<hr>



<h3 class="mt-4">

Calcular Interés

</h3>

<input

class="form-control mb-3"

type="number"

id="montoInteres"

placeholder="Monto"

>

<input

class="form-control mb-3"

type="number"

id="porcentajeInteres"

placeholder="Interés %"

>

<button

class="btn btn-success w-100"

onclick="calcularInteres()"

>

Calcular

</button>



<div class="mt-4">

<p id="resultadoInteres"></p>

</div>

</div>

</div>

</div>

</main>



<footer>

<p>

© 2026 TechBank Store

</p>

</footer>



<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">

</script>

<script src="script.js"></script>

</body>

</html>
